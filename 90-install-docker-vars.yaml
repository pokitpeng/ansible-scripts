---
# 用法：
#   1. 核对目标、下载源及 docker_data_root，设 docker_install_enabled: true。
#   2. ansible-playbook -i hosts.ini 90-install-docker.yaml --list-hosts
#   3. ansible-playbook -i hosts.ini 90-install-docker.yaml --limit node1
#      Docker 的 data-root 如在 NVMe 盘上，应先运行 80-init-nvme-disks.yaml。
# 修改前核对目标主机和数据目录，确认后再启用。
docker_install_enabled: true  # 设为 true 才执行
docker_hosts: servers  # 目标主机组或主机名

# 静态 Docker：x86_64 / aarch64 自动从目标主机 facts 映射。
docker_version: "29.8.1"  # 静态 Docker 安装包版本
docker_source_url: https://mirrors.tuna.tsinghua.edu.cn  # 静态包镜像站根地址
# 阿里源：https://mirrors.aliyun.com

docker_data_root: /data/docker  # 镜像和容器数据目录
docker_max_concurrent_downloads: 10  # 最大并发镜像层下载数
docker_log_max_size: 100m  # 单个容器日志文件大小上限
docker_log_max_file: "5"  # 保留日志文件数；Docker 要求字符串
docker_daemon_experimental: true  # 是否开启 dockerd 实验功能
docker_daemon_debug: true  # 是否开启 dockerd 调试日志
docker_buildkit_enabled: true  # 是否开启 BuildKit
