---
# 用法：
#   安装：
#   1. 核对版本、下载源和模块代理，设 golang_enabled: true、golang_action: install。
#   2. ansible-playbook -i hosts.ini 75-install-golang.yaml --list-hosts
#   3. ansible-playbook -i hosts.ini 75-install-golang.yaml --limit node1
#   卸载：设 golang_action: uninstall。只删除 /usr/local/go、本剧本创建的 PATH 链接
#   和 /etc/profile.d/ansible-golang.sh。默认保留安装包缓存；
#   golang_remove_cache: true 时一并删除 golang_cache_dir。
# 安装包默认走阿里云。也可改为：
#   https://mirrors.ustc.edu.cn/golang
#   https://go.dev/dl
# golang_sha256 留空则不校验；填写时必须对应当前 golang_version。
golang_enabled: true  # 设为 true 才执行
golang_action: install  # install 或 uninstall
golang_remove_cache: false  # uninstall 时是否删除 golang_cache_dir
golang_hosts: servers  # 目标主机组或主机名
golang_version: "1.26.8"  # Go 版本，不含 go 前缀
golang_source_url: https://mirrors.aliyun.com/golang  # 安装包镜像根地址，不含末尾斜杠
golang_cache_dir: /opt/golang  # 安装包缓存目录
golang_goproxy: "https://goproxy.cn,direct"  # 模块代理；留空则不写 GOPROXY
golang_gosumdb: ""  # 校验和数据库；留空则不写 GOSUMDB
# 阿里云代理：https://mirrors.aliyun.com/goproxy/,direct
# 官方代理：https://proxy.golang.org,direct
golang_sha256:  # 当前版本安装包校验值；留空则不校验
  amd64: ""  # x86_64 文件
  arm64: ""  # aarch64 文件
