---
# 配置与用法见 20-set-root-password-vars.yaml

- name: 校验 root 密码配置
  hosts: localhost
  gather_facts: false
  vars_files:
    - 20-set-root-password-vars.yaml
  tags: [always, verify]
  tasks:
    - name: 拒绝未启用的任务
      ansible.builtin.fail:
        msg: >-
          set_root_enabled 为 false，请在 20-set-root-password-vars.yaml 中设为 true
          或通过 -e set_root_enabled=true 启用
      when: not (set_root_enabled | bool)

    - name: 拒绝空密码
      ansible.builtin.fail:
        msg: 请设置 set_root_password（新 root 密码）
      when: set_root_password | default('') | trim | length == 0

    - name: 拒绝默认占位密码
      ansible.builtin.fail:
        msg: 请将 set_root_password 修改为实际密码，不要使用 changeme
      when: set_root_password == 'changeme'

    - name: 打印目标主机
      ansible.builtin.debug:
        msg: "目标主机: {{ set_root_hosts }}（可用 --limit 进一步限定）"

- name: 修改 root 密码并配置 SSH 登录策略
  hosts: "{{ set_root_hosts }}"
  become: true
  gather_facts: false
  vars_files:
    - 20-set-root-password-vars.yaml
  pre_tasks:
    - name: 校验本机 root 密码任务已启用且密码非空
      ansible.builtin.assert:
        that:
          - set_root_enabled | bool
          - set_root_password | length > 0
          - set_root_password != 'changeme'
      no_log: true
  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted
  tasks:
    - name: 设置 root 密码
      ansible.builtin.user:
        name: root
        password: "{{ set_root_password | password_hash('sha512', (inventory_hostname | hash('sha256'))[:16]) }}"
        update_password: always
      no_log: true

    - name: 移除 cloud-init 配置中误加的 PermitRootLogin
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/50-cloud-init.conf
        regexp: '^#?\s*PermitRootLogin\b.*'
        state: absent
      notify: Restart ssh

    - name: 部署 root 登录 sshd drop-in 配置
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-root-login.conf
        mode: "0644"
        content: |
          PermitRootLogin {{ set_root_permit_login }}
          PasswordAuthentication {{ 'yes' if set_root_password_auth | bool else 'no' }}
      notify: Restart ssh

    - name: 更新主 sshd_config 中的 PermitRootLogin
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*PermitRootLogin\b'
        line: "PermitRootLogin {{ set_root_permit_login }}"
        create: false
      notify: Restart ssh

    - name: 更新主 sshd_config 中的 PasswordAuthentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*PasswordAuthentication\b'
        line: "PasswordAuthentication {{ 'yes' if set_root_password_auth | bool else 'no' }}"
        create: false
      notify: Restart ssh

    - name: 校验 sshd 配置语法
      ansible.builtin.command: sshd -t
      changed_when: false

    - name: 确认 root 可登录
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: root 密码已更新，PermitRootLogin={{ set_root_permit_login }}，
          PasswordAuthentication={{ 'yes' if set_root_password_auth | bool else 'no' }}
