---
# 用法：
#   1. 确认目标机已有 Docker，核对版本、Gitee 源和校验值，设 docker_buildx_enabled: true。
#   2. ansible-playbook -i hosts.ini 95-install-buildx.yaml --list-hosts
#   3. ansible-playbook -i hosts.ini 95-install-buildx.yaml --limit node1
docker_buildx_enabled: true  # 设为 true 才执行
docker_buildx_hosts: servers  # 目标主机组或主机名
docker_buildx_version: "0.37.1"  # Buildx 插件版本
docker_buildx_source_url: https://gitee.com/banbaolatiao/buildx  # Buildx 发布仓库根地址
docker_buildx_sha256:  # 官方 v0.37.1 二进制校验值；更换版本时同步更新
  amd64: "9447199cdb435f25880548343c128a4b6650e8891ee598905d8d29d39a8e359b"  # x86_64 文件
  arm64: "e5cc9fe3bbff5cbc91230981f7860e06076110730a2db997082652199042a1f2"  # aarch64 文件
