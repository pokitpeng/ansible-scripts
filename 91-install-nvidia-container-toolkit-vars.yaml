---
# 用法：
#   1. 将官方 Release 的 deb 压缩包同步到下方 Gitee 仓库，目标机需为 Ubuntu/Debian。
#   2. 核对主机、版本及 SHA256，设 nvidia_toolkit_enabled: true。
#   3. ansible-playbook -i hosts.ini 91-install-nvidia-container-toolkit.yaml --list-hosts
#   4. ansible-playbook -i hosts.ini 91-install-nvidia-container-toolkit.yaml --limit node1 --check --diff
#   5. ansible-playbook -i hosts.ini 91-install-nvidia-container-toolkit.yaml --limit node1
#   6. 安装宿主机 NVIDIA 驱动及 Docker 后，运行 92-configure-nvidia-runtime.yaml。
# dry-run 只比较已安装包版本，不下载、不验证下载源或模拟依赖解析。
nvidia_toolkit_enabled: true  # 设为 true 才执行
nvidia_toolkit_hosts: servers  # 目标主机组或主机名
nvidia_toolkit_version: "1.20.1"  # 官方 Release 版本，不含 v 前缀
nvidia_toolkit_package_revision: "1"  # deb 包修订号，对应版本 1.20.1-1
nvidia_toolkit_source_url: https://gitee.com/banbaolatiao/nvidia-container-toolkit  # 国内 Release 仓库根地址
nvidia_toolkit_cache_dir: /opt/nvidia-container-toolkit  # 下载和解压缓存目录
nvidia_toolkit_sha256:  # 官方压缩包 SHA256；变更版本时一并更新
  amd64: "14dc22489851d4f1a6d1bbfdfb51524c8f110091738570cddaddc09778a63ad9"  # x86_64 压缩包
  arm64: "2b58b68ec388cede52815a63fc87f3f019af96e21b7d29c3cb2890341db14b21"  # aarch64 压缩包；缺少镜像文件时下载报错
