---
# 用法：
#   1. 在 hosts.ini 配置可登录且可 sudo 的账号；将 set_root_enabled 设为 true。
#   2. 将 set_root_password 放入单独的 Ansible Vault 文件，不要提交明文密码。
#   3. ansible-playbook -i hosts.ini 20-set-root-password.yaml --list-hosts
#   4. ansible-playbook -i hosts.ini 20-set-root-password.yaml --limit node1 -e @/path/to/root-secret.yaml --ask-vault-pass
# 用 Ansible Vault 或交互式变量传递密码；不要提交明文密码。
set_root_enabled: true  # 设为 true 才执行
set_root_hosts: servers  # 目标主机组或主机名
set_root_password: "jsfSYAdsh233s1s7"  # 新 root 密码；建议用 Vault 覆盖
set_root_permit_login: "prohibit-password"  # sshd 的 PermitRootLogin 值
set_root_password_auth: false  # 是否允许 SSH 密码认证
