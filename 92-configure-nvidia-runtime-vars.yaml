---
# 用法：
#   1. 确认目标机已有 Docker 和 NVIDIA Container Toolkit，设 nvidia_runtime_enabled: true。
#   2. ansible-playbook -i hosts.ini 92-configure-nvidia-runtime.yaml --list-hosts
#   3. ansible-playbook -i hosts.ini 92-configure-nvidia-runtime.yaml --limit node1 --check --diff
#   4. ansible-playbook -i hosts.ini 92-configure-nvidia-runtime.yaml --limit node1
nvidia_runtime_enabled: true  # 设为 true 才执行
nvidia_runtime_hosts: servers  # 目标主机组或主机名
nvidia_runtime_docker_config: /etc/docker/daemon.json  # Docker daemon 配置文件
nvidia_runtime_set_as_default: true  # 是否将 nvidia 设为 Docker 默认 runtime
nvidia_runtime_verify: true  # 应用后是否用 docker info 验证 runtime
